apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-payments-function
  namespace: fcg
  labels:
    app: fcg-payments-function
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fcg-payments-function
  template:
    metadata:
      labels:
        app: fcg-payments-function
    spec:
      containers:
      - name: fcg-payments-function
        image: southamerica-east1-docker.pkg.dev/tech-challenge-fase-5-487617/fcg-docker/payments-function:latest
        ports:
        - containerPort: 80
        env:
        # ConfigMap values
        - name: DatabaseProvider
          valueFrom:
            configMapKeyRef:
              name: payments-config
              key: DatabaseProvider
        - name: FUNCTIONS_WORKER_RUNTIME
          valueFrom:
            configMapKeyRef:
              name: payments-config
              key: FUNCTIONS_WORKER_RUNTIME
        - name: AzureWebJobsFeatureFlags
          valueFrom:
            configMapKeyRef:
              name: payments-config
              key: AzureWebJobsFeatureFlags
        - name: PaymentQueueName
          valueFrom:
            configMapKeyRef:
              name: payments-config
              key: PaymentQueueName
        
        # Secret values
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: fcg-secrets
              key: ConnectionStrings__DefaultConnection
        - name: RabbitMqConnection
          valueFrom:
            secretKeyRef:
              name: fcg-secrets
              key: RabbitMqConnection
        - name: AzureWebJobsStorage
          value: ""
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: fcg-payments-function
  namespace: fcg
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: fcg-payments-function

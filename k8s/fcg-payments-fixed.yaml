apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-payments
  namespace: fcg
  labels:
    app: fcg-payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fcg-payments
  template:
    metadata:
      labels:
        app: fcg-payments
    spec:
      containers:
      - name: fcg-payments
        image: southamerica-east1-docker.pkg.dev/tech-challenge-fase-5-487617/fcg-docker/payments-api:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        # ConfigMap values
        - name: DatabaseProvider
          valueFrom:
            configMapKeyRef:
              name: payments-config
              key: DatabaseProvider
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: payments-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ReverseProxyBasePath
          valueFrom:
            configMapKeyRef:
              name: payments-config
              key: ReverseProxyBasePath
        - name: Messaging__Enabled
          valueFrom:
            configMapKeyRef:
              name: payments-config
              key: Messaging__Enabled
        - name: Messaging__Host
          valueFrom:
            configMapKeyRef:
              name: payments-config
              key: Messaging__Host
        - name: Messaging__Port
          valueFrom:
            configMapKeyRef:
              name: payments-config
              key: Messaging__Port
        - name: Messaging__VHost
          valueFrom:
            configMapKeyRef:
              name: payments-config
              key: Messaging__VHost
        - name: Messaging__Exchange
          valueFrom:
            configMapKeyRef:
              name: payments-config
              key: Messaging__Exchange
        - name: Messaging__RoutingKey
          valueFrom:
            configMapKeyRef:
              name: payments-config
              key: Messaging__RoutingKey
        
        # Secret values
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: fcg-secrets
              key: ConnectionStrings__DefaultConnection
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: fcg-secrets
              key: Jwt__Key
        - name: Messaging__Username
          valueFrom:
            secretKeyRef:
              name: fcg-secrets
              key: Messaging__Username
        - name: Messaging__Password
          valueFrom:
            secretKeyRef:
              name: fcg-secrets
              key: Messaging__Password
        - name: ApplicationInsights__ConnectionString
          valueFrom:
            secretKeyRef:
              name: fcg-secrets
              key: ApplicationInsights__ConnectionString
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: fcg-payments
  namespace: fcg
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: fcg-payments

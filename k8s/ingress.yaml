apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments-ingress
  namespace: fcg-payments
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "payments-ip"  # OPCIONAL: IP estático
    networking.gke.io/managed-certificates: "payments-cert"     # OPCIONAL: Certificado gerenciado
    kubernetes.io/ingress.allow-http: "true"
spec:
  rules:
  - host: payments.fcg.com.br  # AJUSTE para seu domínio
    http:
      paths:
      - path: /payments
        pathType: Prefix
        backend:
          service:
            name: payments-api
            port:
              number: 80
  # Adicione mais regras se necessário para a Function
  # - host: payments-function.fcg.com.br
  #   http:
  #     paths:
  #     - path: /
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: payments-function
  #           port:
  #             number: 80

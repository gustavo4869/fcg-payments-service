apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
  namespace: fcg
data:
  # Database Configuration
  DatabaseProvider: "PostgreSQL"
  
  # Application Insights
  ApplicationInsights__EnableAdaptiveSampling: "false"
  ApplicationInsights__EnablePerformanceCounterCollectionModule: "true"
  ApplicationInsights__EnableDependencyTrackingTelemetryModule: "true"
  
  # Messaging Configuration (RabbitMQ)
  Messaging__Enabled: "true"
  Messaging__Host: "rabbitmq.fcg.svc.cluster.local"
  Messaging__Port: "5672"
  Messaging__VHost: "/"
  Messaging__Exchange: "payments"
  Messaging__RoutingKey: "payment.processed"
  Messaging__Queue: "payments-processed"
  
  # API Configuration
  ReverseProxyBasePath: "/payments"
  ASPNETCORE_ENVIRONMENT: "Production"
  
  # Functions Configuration
  FUNCTIONS_WORKER_RUNTIME: "dotnet-isolated"
  AzureWebJobsFeatureFlags: "EnableWorkerIndexing"
  PaymentQueueName: "payment.pending"
